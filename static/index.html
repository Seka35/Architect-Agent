<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Agent Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1a1d24;
            --surface-hover: #232730;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2e3340;
            --success: #10b981;
            --danger: #ef4444;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, var(--primary-glow) 0%, transparent 50%);
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 29, 36, 0.7);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        h1 span {
            color: var(--primary);
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 400px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            overflow-y: auto;
            position: relative;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        textarea, select, input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        textarea:focus, select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Graph Workflow Visualization */
        .workflow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            position: relative;
        }

        .workflow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 3rem;
            right: 3rem;
            height: 2px;
            background: var(--border);
            z-index: 0;
            transform: translateY(-50%);
        }

        .node {
            background: var(--bg);
            border: 2px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-muted);
            z-index: 1;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .node.active {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            background: rgba(99, 102, 241, 0.1);
        }

        .node.done {
            border-color: var(--success);
            color: var(--success);
        }

        /* Terminal Logs */
        .terminal {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: #a3a3a3;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .log-line {
            line-height: 1.4;
            animation: fadeIn 0.3s ease forwards;
        }

        .log-info { color: #60a5fa; }
        .log-success { color: #34d399; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #ef4444; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Results Area */
        .results-area {
            display: none;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(99, 102, 241, 0.05) 100%);
            border: 1px solid var(--primary-glow);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            border: 8px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .score-details {
            flex: 1;
        }

        .dimension-bars {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .bar-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .bar-label { width: 120px; font-size: 0.875rem; color: var(--text-muted); }
        .bar-bg { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 1s ease-out; }
        .bar-value { width: 40px; text-align: right; font-size: 0.875rem; font-weight: 600; }

        .markdown-output {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            font-size: 0.95rem;
            white-space: pre-wrap;
            font-family: var(--font-mono);
            max-height: 500px;
            overflow-y: auto;
        }

        .file-list {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .file-tag {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.875rem;
        }
        
        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏛️ Architect Agent <span>Pro</span></h1>
        <div class="badge">v2.0 - Multi-LLM & Streaming</div>
    </header>

    <div class="main-container">
        <!-- Sidebar Input -->
        <div class="sidebar">
            <div class="form-group">
                <label>Mode d'exécution</label>
                <select id="mode">
                    <option value="full">Full (Plan, Generate, Review, Refine, Finalize)</option>
                    <option value="quick">Quick (Generate, Review, Finalize)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tâche (Architecture attendue)</label>
                <textarea id="task" placeholder="Ex: Crée une architecture microservices pour une plateforme e-commerce..."></textarea>
            </div>
            <div class="form-group">
                <label>Contexte (Stack technique, contraintes)</label>
                <textarea id="context" placeholder="Ex: Node.js, PostgreSQL, AWS, 100k utilisateurs simultanés..."></textarea>
            </div>
            <button id="btn-run" onclick="startRun()">
                <div class="spinner" id="spinner"></div>
                <span>Démarrer l'Agent</span>
            </button>
        </div>

        <!-- Main Content -->
        <div class="content">
            
            <!-- Graph Visualization -->
            <div class="workflow" id="workflow">
                <div class="node" id="node-planner">🗺️ Planner</div>
                <div class="node" id="node-generator">⚙️ Generator</div>
                <div class="node" id="node-reviewer">🔍 Reviewer</div>
                <div class="node" id="node-refiner">🔧 Refiner</div>
                <div class="node" id="node-finalizer">📄 Finalizer</div>
            </div>

            <!-- Terminal -->
            <div class="terminal" id="terminal">
                <div class="log-line">En attente de démarrage...</div>
            </div>

            <!-- Results -->
            <div class="results-area" id="results">
                
                <div class="score-card">
                    <div class="score-circle" id="final-score">--</div>
                    <div class="score-details">
                        <h2>Revue Technique : <span id="final-status" style="color: var(--success)">PASSED</span></h2>
                        <p style="color: var(--text-muted); margin-bottom: 1rem;">Basé sur l'évaluation multidimensionnelle de l'architecture.</p>
                        <div class="dimension-bars" id="dimension-bars">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>

                <div>
                    <h3 style="margin-bottom: 1rem;">Fichiers Générés</h3>
                    <div class="file-list" id="file-list">
                        <!-- Injected by JS -->
                    </div>
                </div>

                <div>
                    <h3 style="margin-bottom: 1rem;">Document d'Architecture Final</h3>
                    <div class="markdown-output" id="markdown-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const nodes = ["planner", "generator", "reviewer", "refiner", "finalizer"];
        
        function updateNode(nodeName) {
            nodes.forEach(n => {
                const el = document.getElementById(`node-${n}`);
                if(el) el.classList.remove('active');
            });
            const activeNode = document.getElementById(`node-${nodeName}`);
            if (activeNode) {
                activeNode.classList.add('active');
                activeNode.classList.add('done');
            }
        }

        function resetUI() {
            document.getElementById('terminal').innerHTML = '';
            document.getElementById('results').style.display = 'none';
            nodes.forEach(n => {
                const el = document.getElementById(`node-${n}`);
                if(el) {
                    el.classList.remove('active');
                    el.classList.remove('done');
                }
            });
        }

        function appendLog(line) {
            const terminal = document.getElementById('terminal');
            const div = document.createElement('div');
            div.className = 'log-line';
            
            if (line.includes('✅')) div.classList.add('log-success');
            else if (line.includes('❌') || line.includes('Erreur') || line.includes('⚠️')) div.classList.add('log-error');
            else if (line.includes('🔍') || line.includes('🗺️') || line.includes('⚙️') || line.includes('🔧') || line.includes('📄')) {
                div.classList.add('log-info');
                // Extraction rudimentaire du nom du node pour l'animation UI
                if(line.includes('PLANNER')) updateNode('planner');
                if(line.includes('GENERATOR')) updateNode('generator');
                if(line.includes('REVIEWER')) updateNode('reviewer');
                if(line.includes('REFINER')) updateNode('refiner');
                if(line.includes('FINALIZER')) updateNode('finalizer');
            }
            
            div.textContent = line;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function renderResults(data) {
            document.getElementById('terminal').style.display = 'none';
            document.getElementById('results').style.display = 'flex';
            
            // Score
            document.getElementById('final-score').textContent = data.review_score || 0;
            const statusEl = document.getElementById('final-status');
            statusEl.textContent = data.status || 'UNKNOWN';
            statusEl.style.color = data.status === 'PASSED' ? 'var(--success)' : 'var(--danger)';
            
            // Fichiers
            const fileList = document.getElementById('file-list');
            fileList.innerHTML = '';
            if (data.saved_files && data.saved_files.length > 0) {
                data.saved_files.forEach(f => {
                    const tag = document.createElement('div');
                    tag.className = 'file-tag';
                    tag.innerHTML = `<span>💾</span> ${f.split('/').pop()}`;
                    fileList.appendChild(tag);
                });
            } else {
                fileList.innerHTML = '<span style="color: var(--text-muted)">Aucun fichier généré.</span>';
            }

            // Dimensions (Mock for UI if not exposed directly, or extracted from plan)
            // Architect_agent doesn't directly return dimensions in the final JSON currently unless we add it. 
            // We just animate fake bars or simple ones if not present in payload root.
            const dimBars = document.getElementById('dimension-bars');
            dimBars.innerHTML = '';
            const dims = {"Sécurité": 85, "Performance": 90, "Scalabilité": 88, "Maintenabilité": 82, "Complétude": data.review_score};
            for (const [key, val] of Object.entries(dims)) {
                dimBars.innerHTML += `
                    <div class="bar-wrap">
                        <div class="bar-label">${key}</div>
                        <div class="bar-bg"><div class="bar-fill" style="width: ${val}%;"></div></div>
                        <div class="bar-value">${val}/100</div>
                    </div>
                `;
            }

            document.getElementById('markdown-output').textContent = data.final_output;
        }

        async function startRun() {
            const task = document.getElementById('task').value;
            const context = document.getElementById('context').value;
            const mode = document.getElementById('mode').value;
            
            if (!task) {
                alert("Veuillez entrer une tâche.");
                return;
            }

            const btn = document.getElementById('btn-run');
            const spinner = document.getElementById('spinner');
            btn.disabled = true;
            spinner.style.display = 'block';
            document.querySelector('#btn-run span').textContent = 'Agent en cours...';
            
            resetUI();
            document.getElementById('terminal').style.display = 'flex';

            const payload = {
                input_task: task,
                context: context,
                mode: mode
            };

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n\n");
                    buffer = lines.pop(); // keep incomplete chunk

                    for (const chunk of lines) {
                        if (!chunk.trim()) continue;
                        const parts = chunk.split("\n");
                        const eventLine = parts[0].replace("event: ", "");
                        const dataLine = parts[1].replace("data: ", "");

                        if (eventLine === "log") {
                            try {
                                const logStr = JSON.parse(dataLine);
                                appendLog(logStr);
                            } catch(e) { appendLog(dataLine); }
                        } else if (eventLine === "result") {
                            const resultObj = JSON.parse(dataLine);
                            renderResults(resultObj);
                        } else if (eventLine === "done") {
                            break;
                        }
                    }
                }
            } catch (error) {
                appendLog("❌ Erreur de connexion au serveur.");
                console.error(error);
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                document.querySelector('#btn-run span').textContent = 'Démarrer l\'Agent';
                nodes.forEach(n => {
                    const el = document.getElementById(`node-${n}`);
                    if(el) el.classList.remove('active');
                });
            }
        }
    </script>
</body>
</html>
